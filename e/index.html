<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="君浩國際有限公司資金需求資訊專題。最高可選 100 萬，先選金額，再由專員協助確認。">
  <meta name="theme-color" content="#F6F3EE">
  <title>君浩國際有限公司｜10萬至100萬資金需求評估</title>
  <link rel="stylesheet" href="../styles.css?v=2026080401">
  <style>
    :root {
      color-scheme: light;
      --bg: #F6F3EE;
      --surface: #FFFDF9;
      --surface-soft: #F2ECE3;
      --text: #17233A;
      --text-soft: #687386;
      --line: #E4DDD2;
      --accent: #1E3A5F;
      --accent-strong: #142A45;
      --accent-soft: #E8EEF5;
      --accent-ink: #17233A;
      --danger: #B42318;
      --shadow: 0 28px 80px rgba(23, 35, 58, .12);
    }
    body { background: radial-gradient(circle at 12% 4%, rgba(216, 138, 43, .12), transparent 28rem), var(--bg); }
    .wordmark-mark { background: #D88A2B; color: #FFFDF9; }
    .header-note, .eyebrow, .form-kicker, .success-kicker { color: #1E3A5F; }
    .amount-intro { border: 1px solid #E4DDD2; }
    .amount-intro h1 strong { color: #D88A2B; }
    .limit-visual { background: #17233A; }
    .limit-visual > span { color: #F1D6A9; }
    .limit-visual b { color: #E8BE7C; }
    .limit-visual p { color: #DCE4EE; }
    .amount-option:hover { border-color: #D88A2B; }
    .amount-option.selected { border-color: #17233A; background: #17233A; box-shadow: 0 14px 30px rgba(23, 35, 58, .22); }
    .featured { border-color: #D88A2B; background: #FFF9EF; }
    .featured-label { background: #D88A2B; }
    .selection-message.ready strong { color: #1E3A5F; }
    .primary-button { background: #1E3A5F; box-shadow: 0 12px 26px rgba(30, 58, 95, .24); }
    .primary-button:hover:not(:disabled) { background: #142A45; }
    .site-footer { color: #687386; }
  </style>
  <script src="../app.js?v=2026080401" defer></script>
</head>
<body data-page="amount">
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="index.html" aria-label="返回金額選擇頁">
        <span class="wordmark-mark" aria-hidden="true">額</span>
        <span>君浩國際有限公司｜資金需求評估</span>
      </a>
      <span class="header-note">只填 3 項資料</span>
    </div>
  </header>

  <main class="amount-main">
    <section class="amount-shell" aria-labelledby="amount-title">
      <div class="flow-nav" aria-label="申請流程">
        <span class="flow-item current">選擇金額</span>
        <span class="flow-line" aria-hidden="true"></span>
        <span class="flow-item">填寫資料</span>
      </div>

      <div class="amount-hero">
        <div class="amount-intro">
          <p class="eyebrow">最高可選 100 萬</p>
          <h1 id="amount-title">想借多少<br><strong>先自己選</strong></h1>
          <p>先選擇希望金額，再由專員協助整理基本條件，讓符合條件的案件更順利進入評估。</p>
        </div>
        <div class="limit-visual" aria-label="最高資金需求一百萬">
          <span>資金需求上限</span>
          <div><strong>100</strong><b>萬</b></div>
          <p>10萬至100萬需求皆可登記</p>
        </div>
      </div>

      <div class="amount-grid" id="amount-options" aria-label="選擇需求金額">
        <button class="amount-option" type="button" data-amount="10萬-20萬" aria-pressed="false">
          <small>靈活週轉</small>
          <span class="amount-number">10<span>萬</span> - 20<span>萬</span></span>
        </button>
        <button class="amount-option" type="button" data-amount="20萬-30萬" aria-pressed="false">
          <small>資金補足</small>
          <span class="amount-number">20<span>萬</span> - 30<span>萬</span></span>
        </button>
        <button class="amount-option" type="button" data-amount="30萬-50萬" aria-pressed="false">
          <small>高額需求</small>
          <span class="amount-number">30<span>萬</span> - 50<span>萬</span></span>
        </button>
        <button class="amount-option featured" type="button" data-amount="50萬-100萬" aria-pressed="false">
          <span class="featured-label">最高可選</span>
          <small>百萬內需求</small>
          <span class="amount-number">50<span>萬</span> - 100<span>萬</span></span>
        </button>
      </div>

      <div class="selection-bar">
        <div class="selection-message" id="selection-message" aria-live="polite">
          <span>尚未選擇金額</span>
          <strong>選一個額度開始</strong>
        </div>
        <button class="primary-button amount-continue" id="amount-continue" type="button" disabled>
          選好金額後繼續
        </button>
      </div>

      <div class="trust-list" aria-label="申請說明">
        <span><b aria-hidden="true">✓</b> 只填 3 項資料</span>
        <span><b aria-hidden="true">✓</b> 僅限非警示戶申請</span>
        <span><b aria-hidden="true">✓</b> 不需手機驗證</span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>本頁僅供資金需求登記，不代表核准、利率或撥款承諾，實際結果依個別條件確認。</p>
  </footer>

  <noscript>請開啟 JavaScript 後使用線上申請功能。</noscript>
</body>
</html>
